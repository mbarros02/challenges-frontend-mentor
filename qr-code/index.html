<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qr-code</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <main class="qr-section">

        <div>
            <img class="image-qr-code" src="/img/image-qr-code.png" alt="qr-code">
        </div>

        <div class="main">
            <p class="p-main">Improve your front-end <br> skills by building projects</p>
        </div>

        <div class="information">
            <p class="p-information">Scan the QR code to visit Frontend <br> Mentor and take your coding skills to the next level</p>
        </div>

    </main>
    
</body>
</html>
